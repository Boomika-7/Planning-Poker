<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-label="Planning Poker"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071D55"/>
      <stop offset="100%" stop-color="#0867E8"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="8"
        flood-color="#00143A"
        flood-opacity=".25"
      />
    </filter>
  </defs>

  <!-- Background -->
  <rect
    x="20"
    y="20"
    width="472"
    height="472"
    rx="105"
    fill="url(#bg)"
  />

  <!-- Cards -->
  <g filter="url(#shadow)">

    <!-- Left card -->
    <g transform="rotate(-17 174 287)">
      <rect
        x="92"
        y="171"
        width="164"
        height="230"
        rx="24"
        fill="#B8D9FF"
      />
      <text
        x="174"
        y="310"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="105"
        font-weight="800"
        fill="#071A4D"
      >3</text>
    </g>

    <!-- Right card -->
    <g transform="rotate(17 338 287)">
      <rect
        x="256"
        y="171"
        width="164"
        height="230"
        rx="24"
        fill="#A9F6C8"
      />
      <text
        x="338"
        y="310"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="105"
        font-weight="800"
        fill="#071A4D"
      >?</text>
    </g>

    <!-- Center card -->
    <g transform="rotate(4 256 274)">
      <rect
        x="169"
        y="137"
        width="174"
        height="264"
        rx="25"
        fill="#FFFFFF"
      />
      <text
        x="256"
        y="310"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="142"
        font-weight="800"
        fill="#071A4D"
      >8</text>
    </g>
  </g>

  <!-- Highlight rays -->
  <g
    stroke="#FFC23E"
    stroke-width="13"
    stroke-linecap="round"
  >
    <path d="M256 105V77"/>
    <path d="M219 112L199 91"/>
    <path d="M293 112L313 91"/>
  </g>
</svg>